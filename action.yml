name: Trajectly
description: >
  Deterministic regression testing for AI agents.
  Thin wrapper around the trajectly CLI — no TRT logic lives here.
branding:
  icon: check-circle
  color: blue

inputs:
  spec_glob:
    description: Glob pattern for agent spec files
    required: false
    default: "specs/*.agent.yaml"
  project_root:
    description: Root directory of the project
    required: false
    default: "."
  python_version:
    description: Python version to use
    required: false
    default: "3.11"
  trajectly_version:
    description: Trajectly package version used when install=pypi
    required: false
    default: "0.4.2"
  install:
    description: 'How to install trajectly: "editable" (pip install -e <project_root>) or "pypi" (pip install trajectly==<trajectly_version>)'
    required: false
    default: pypi
  comment_pr:
    description: Post a PR comment with the report summary (pull_request events only)
    required: false
    default: "false"
  upload_artifacts:
    description: Upload .trajectly/** as build artifacts
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install Trajectly
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        if [ "${{ inputs.install }}" = "editable" ]; then
          python -m pip install -e "${{ inputs.project_root }}"
        else
          python -m pip install "trajectly==${{ inputs.trajectly_version }}"
        fi

    - name: Run specs
      id: run
      shell: bash
      working-directory: ${{ inputs.project_root }}
      run: |
        set +e
        python -m trajectly run ${{ inputs.spec_glob }} --project-root .
        echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      continue-on-error: true

    - name: Generate PR comment report
      if: always()
      shell: bash
      working-directory: ${{ inputs.project_root }}
      run: |
        python -m trajectly report --pr-comment > trajectly_pr_comment.md 2>/dev/null || true

    - name: Post PR comment
      if: inputs.comment_pr == 'true' && github.event_name == 'pull_request' && always()
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- trajectly-report -->';
          const commentPath = `${{ inputs.project_root }}/trajectly_pr_comment.md`;

          if (!fs.existsSync(commentPath)) return;
          const body = fs.readFileSync(commentPath, 'utf8').trim();
          if (!body) return;

          const fullBody = `${marker}\n${body}`;

          try {
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
          } catch (err) {
            core.setFailed(
              `Unable to post PR comment. If you use comment_pr=true, grant pull-requests: write permission. Original error: ${err.message}`
            );
          }

    - name: Upload artifacts
      if: inputs.upload_artifacts == 'true' && always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: trajectly-results
        path: ${{ inputs.project_root }}/.trajectly/**
        include-hidden-files: true
        if-no-files-found: ignore

    - name: Propagate exit code
      shell: bash
      run: exit ${{ steps.run.outputs.exit_code || 0 }}
