name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pre-commit pyyaml

      - name: Validate action metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          data = yaml.safe_load(Path("action.yml").read_text(encoding="utf-8"))
          assert data["name"] == "Trajectly"
          assert data["runs"]["using"] == "composite"
          assert data["runs"]["steps"], "action.yml must define composite steps"
          PY

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
